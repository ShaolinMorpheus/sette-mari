const lerpv=(a,b,k)=>a+(b-a)*k,ez=(a,b,x)=>{const k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k)};

for(const c of head.children)c.visible=false;
const hmat=new T.MeshBasicMaterial({transparent:true,side:T.DoubleSide,alphaTest:.02});
hplane=new T.Mesh(new T.PlaneGeometry(1,1),hmat);head.add(hplane);hplane.visible=true;
function applyHead(view,P){
  let e=0;if(P&&(P.mode==='chop'||P.mode==='strike')){const u=P.u==null?0:P.u;e=(u>=.3&&u<.62)?2:(u>=.1&&u<.3?1:0)}
  const k=(view==='back'?'b':view==='side'?'s':'f')+(view==='back'?0:e);
  const t=HT[k];hmat.map=t;hmat.needsUpdate=true;
  const w=t.image.width*HS,h=t.image.height*HS;hplane.scale.set(w,h,1);
  const cx=(t.image.width/2-hmeta[k])*HS;   // centro piano rispetto al riferimento
  const cy=CHIN+(REFY-t.image.height/2)*HS;
  hplane.rotation.set(0,0,0);
  if(view==='front'){hplane.position.set(cx,cy,8)}
  else if(view==='back'){hplane.rotation.y=Math.PI;hplane.position.set(-cx,cy,-8)}
  else{hplane.rotation.set(0,-Math.PI/2,.07);hplane.position.set(-8,cy+1.5,cx-5.5)}
}
window.applyHead=applyHead;
Promise.all(Object.keys(hmeta).map(k=>new Promise(r=>{const im=new Image();im.onload=()=>{const t=new T.Texture(im);t.colorSpace=T.SRGBColorSpace;t.anisotropy=8;t.needsUpdate=true;HT[k]=t;r()};im.src='heads/'+k+'.png'}))).then(()=>{window.ready=true});
</script>
